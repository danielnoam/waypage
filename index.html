<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F4EE">
  <title>Waypage</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="src/fonts.css?v=1.25.0">
  <link rel="stylesheet" href="src/styles.css?v=1.25.0">
</head>
<body>
  <div class="app" id="libraryView">
    <div class="top-bar" id="topBar">
      <button class="icon-btn menu-btn" id="sideBtn" type="button" aria-label="Library and feeds" aria-expanded="false" aria-controls="sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <h1 class="screen-title" id="placeTitle">Library</h1>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" type="button" aria-label="Search" aria-expanded="false" aria-controls="searchBox" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
        <button class="icon-btn dl-btn sync-btn" id="syncBtn" type="button" aria-label="Sync" hidden>
          <svg class="dl-ring" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle class="dl-ring-track" cx="20" cy="20" r="17"></circle><circle class="dl-ring-fill" cx="20" cy="20" r="17" pathLength="100"></circle></svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 19h9.5a4 4 0 0 0 .7-7.94A5.5 5.5 0 0 0 7 10.2 4.4 4.4 0 0 0 7.5 19z"></path></svg>
          <span class="dl-dot" aria-hidden="true"></span>
        </button>
        <button class="icon-btn dl-btn" id="downloadsBtn" type="button" aria-label="Downloads" title="Downloads (D)">
          <svg class="dl-ring" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle class="dl-ring-track" cx="20" cy="20" r="17"></circle><circle class="dl-ring-fill" cx="20" cy="20" r="17" pathLength="100"></circle></svg>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5M7.5 10l4.5 4.5 4.5-4.5M5 19.5h14"></path></svg>
          <span class="dl-dot" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </button>
      </div>
    </div>
    <div class="pull" id="pullHint" aria-hidden="true" hidden><span class="pull-mark"></span></div>
    <header class="top">
      <p class="meta" id="libraryMeta"></p>
      <div class="search" id="searchBox" role="search" hidden>
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
        <input id="librarySearch" type="search" placeholder="Search your library" aria-label="Search your library" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" dir="auto">
        <button class="icon-btn search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <p class="meta search-note" id="searchNote" role="status" hidden></p>
      <div class="lib-tools" id="libTools" hidden></div>
    </header>

    <main class="library" id="library" aria-live="polite"><div class="lib-loading wide" data-key="loading" role="status"><span class="spinner" aria-hidden="true"></span>Opening your library</div></main>
    <main class="feeds" id="feeds" hidden></main>
    <main class="highlights" id="highlights" hidden></main>

    <footer class="save-bar">
      <div class="update-bar" id="updateBar" role="status" hidden>
        <span class="update-text" id="updateText"></span>
        <button class="btn-small" id="updateBtn" type="button">View</button>
        <button class="icon-btn update-close" id="updateClose" type="button" aria-label="Dismiss">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <form id="saveForm" class="save-form">
        <label for="saveUrl" class="visually-hidden">Page link</label>
        <span class="save-link-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"></path><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"></path></svg></span>
        <input id="saveUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="Paste a link to save" required>
        <button class="btn-primary" type="submit">Save</button>
        <button class="icon-btn several-btn" id="severalBtn" type="button" aria-label="Save with options">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"></path></svg>
        </button>
      </form>
    </footer>
  </div>

  <section class="reader screen" id="readerView" hidden aria-label="Saved clip">
    <nav class="reader-rail" id="readerRail" aria-label="Contents" hidden>
      <button class="rail-back" id="railBack" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg><span id="railBackLabel">Library</span>
      </button>
      <h2 class="overline rail-over" id="railOver">Contents</h2>
      <ol class="rail-list" id="railList"></ol>
      <div class="rail-foot" id="railFoot"></div>
    </nav>
    <header class="reader-bar">
      <div class="reader-start">
        <button class="icon-btn" id="readerBack" type="button" aria-label="Back to library">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <button class="icon-btn" id="readerContents" type="button" aria-label="Contents" aria-expanded="false" aria-controls="readingSheet" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M13 18h7M4.5 6h.01M4.5 12h.01M8.5 18h.01"></path></svg>
        </button>
        <button class="icon-btn" id="readerFolder" type="button" aria-label="Clips in this collection" aria-expanded="false" aria-controls="readingSheet" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        </button>
        <p class="reader-name" id="readerName" dir="auto"></p>
      </div>
      <div class="reader-actions">
        <span class="pill" id="offlinePill" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h20M12 2l3 10-3 10"></path></svg>Offline
        </span>
        <button class="icon-btn aloud-btn" id="readerAloud" type="button" aria-label="Read aloud" title="Read aloud (S)" aria-pressed="false" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        </button>
        <button class="icon-btn" id="readerMarks" type="button" aria-label="Highlights" title="Highlights (H)" aria-expanded="false" aria-controls="readingSheet">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5L11 18H6v-5z"></path><path d="M4 21h16"></path></svg>
        </button>
        <button class="icon-btn" id="readerAa" type="button" aria-label="Reader settings" title="Reader settings (A)" aria-expanded="false" aria-controls="readingSheet">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="icon-btn" id="readerMore" type="button" aria-label="This clip" title="This clip" aria-expanded="false" aria-controls="readingSheet">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
        </button>
      </div>
    </header>
    <div class="find-bar" id="findBar" role="search" hidden>
      <input class="find-input" id="findInput" type="search" placeholder="Find in this clip" aria-label="Find in this clip" enterkeyhint="search" autocomplete="off" spellcheck="false">
      <span class="find-count" id="findCount" aria-live="polite"></span>
      <button class="icon-btn" id="findPrev" type="button" aria-label="Previous match" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <button class="icon-btn" id="findNext" type="button" aria-label="Next match" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <button class="btn-text find-done" id="findDone" type="button">Done</button>
    </div>
    <iframe class="reader-frame" id="readerFrame" sandbox="allow-same-origin" title="Saved clip"></iframe>
    <div class="reader-wait" id="readerWait" role="status" aria-label="Opening"><span class="spinner" aria-hidden="true"></span></div>
    <button class="jump-back" id="jumpBack" type="button" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-4-4 4-4"></path><path d="M5 10h9a5 5 0 0 1 0 10h-3"></path></svg>Back to where you were
    </button>
    <div class="bright" id="bright" hidden>
      <svg class="bright-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <div class="bright-track" id="brightTrack" role="slider" tabindex="0" aria-label="Brightness" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50%">
        <div class="bright-fill" id="brightFill"></div>
      </div>
      <button class="bright-auto" id="brightAuto" type="button" aria-pressed="true" title="The phone's own brightness">Auto</button>
    </div>
    <div class="read-foot" id="readFoot">
      <div class="read-left">
        <span class="read-section" id="readSection" dir="auto" aria-hidden="true"></span>
        <div class="aloud-player" id="aloudPlayer" role="group" aria-label="Reading aloud" hidden>
          <button class="icon-btn" id="aloudPrev" type="button" aria-label="Previous paragraph">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"></path></svg>
          </button>
          <button class="icon-btn aloud-play" id="aloudPlay" type="button" aria-label="Pause">
            <svg class="aloud-pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
            <svg class="aloud-play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </button>
          <button class="icon-btn" id="aloudNext" type="button" aria-label="Next paragraph">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"></path></svg>
          </button>
        </div>
        <button class="aloud-read-next" id="aloudReadNext" type="button" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>Read next
        </button>
        <span class="read-time" id="readLeft" aria-hidden="true"></span>
        <button class="read-keys" id="readKeys" type="button"><kbd>?</kbd>Shortcuts</button>
      </div>
      <div class="read-progress" id="readProgress" aria-hidden="true"><span></span></div>
    </div>
    <div class="viewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="Image" hidden>
      <div class="viewer-stage" id="viewerStage"><img class="viewer-img" id="viewerImg" alt=""></div>
      <p class="viewer-caption" id="viewerCaption" dir="auto" hidden></p>
      <button class="icon-btn viewer-step viewer-prev" id="viewerPrev" type="button" aria-label="Previous picture" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button class="icon-btn viewer-step viewer-next" id="viewerNext" type="button" aria-label="Next picture" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
      <div class="viewer-zoom" role="group" aria-label="Zoom">
        <button class="icon-btn" id="viewerZoomOut" type="button" aria-label="Zoom out">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <button class="icon-btn" id="viewerZoomIn" type="button" aria-label="Zoom in">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
      <button class="icon-btn viewer-close" id="viewerClose" type="button" aria-label="Close image">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="sheet-catch" id="sheetCatch" hidden></div>
    <div class="sheet" id="readingSheet" role="dialog" aria-label="Text and theme" hidden>
      <span class="sheet-grip" aria-hidden="true"></span>
      <div class="sheet-body" id="readingBody"></div>
    </div>
  </section>
  <section class="screen" id="folderView" hidden aria-label="Collection">
    <header class="screen-bar">
      <button class="icon-btn" id="folderBack" type="button" aria-label="Back to library">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button class="btn-text bar-left" id="folderCancel" type="button" hidden>Cancel</button>
      <h1 class="bar-title" id="folderTitle" dir="auto"></h1>
      <button class="icon-btn bar-right" id="folderMore" type="button" aria-label="Collection" aria-haspopup="menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
      <button class="btn-text bar-right" id="folderDone" type="button" hidden>Done</button>
    </header>
    <div class="screen-body" id="folderBody"></div>
  </section>
  <section class="screen" id="batchView" hidden aria-label="Save with options">
    <header class="screen-bar">
      <button class="icon-btn" id="batchBack" type="button" aria-label="Back to library">
        <svg class="back-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        <svg class="close-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <h1 class="bar-title">Save with options</h1>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>
    <div class="screen-body" id="batchBody"></div>
  </section>
  <section class="screen" id="downloadsView" hidden aria-label="Downloads">
    <header class="screen-bar">
      <button class="icon-btn" id="downloadsBack" type="button" aria-label="Back to library">
        <svg class="back-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        <svg class="close-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <h1 class="bar-title">Downloads</h1>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>
    <div class="screen-body" id="downloadsBody">
      <div class="downloads" id="downloads"></div>
    </div>
  </section>
  <section class="screen" id="settingsView" hidden aria-label="Settings">
    <header class="screen-bar">
      <button class="icon-btn" id="settingsBack" type="button" aria-label="Back to library">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg><span class="back-label" aria-hidden="true">Library</span>
      </button>
      <h1 class="bar-title">Settings</h1>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>
    <div class="screen-body" id="settingsBody"></div>
  </section>
  <section class="screen" id="sectionView" hidden aria-labelledby="sectionTitle">
    <header class="screen-bar">
      <button class="icon-btn" id="sectionBack" type="button" aria-label="Back to Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <h1 class="bar-title" id="sectionTitle"></h1>
      <span class="bar-spacer" aria-hidden="true"></span>
    </header>
    <div class="screen-body" id="sectionBody"></div>
  </section>
  <section class="screen" id="newsView" hidden aria-label="What's new">
    <header class="screen-bar">
      <button class="icon-btn" id="newsBack" type="button" aria-label="Back">

      </button>

      <p class="drop-note" id="dropNote">Saved for reading offline, like a pasted link</p>
