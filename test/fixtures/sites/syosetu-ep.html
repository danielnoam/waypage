  <div class="js-novel-text p-novel__text p-novel__text--preface"><p>読んでくれてありがとう。</p></div>
  <div class="js-novel-text p-novel__text"><p id="L1">朝の港は静かだった。</p><p id="L2">船が一隻、ゆっくりと入ってきた。</p><p id="L3">少女は桟橋に立って、それを見ていた。</p><p id="L4">風が塩の匂いを運んでくる。町はまだ眠っている。</p><p id="L5">彼女は手紙を握りしめた。父からの最後の手紙だった。</p></div>
