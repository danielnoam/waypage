# Checks every feed, newsletter and serial in Discover's hand-picked list
# still answers (tools/check-discover.js): weekly, by hand, and on a pull
# request that changes the list. Not a required check: a site that's down
# for a day shouldn't block a merge. A failed weekly run emails the repo's
# owner, which is the reminder to fix or drop the entry.
name: Discover list

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - src/discover-list.js
      - tools/check-discover.js

permissions:
  contents: read

jobs:
  check:
    name: Check Discover's list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-discover.js
