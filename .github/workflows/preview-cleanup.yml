# Removes a branch's preview pre-release (tools/preview-release.sh) when
# the branch is deleted or its pull request closes, so previews don't pile
# up. A fork's pull request has a read-only token here, and its branch
# never had a preview anyway.
name: Preview cleanup

on:
  delete:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove:
    if: github.event_name == 'pull_request' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.ref }}
        run: |
          TAG="preview-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          if gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "removed $TAG"
          else
            echo "no $TAG to remove"
          fi
