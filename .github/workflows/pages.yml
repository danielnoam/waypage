# Deploys the web app to GitHub Pages once the tests pass (2026-11-18,
# from keel's template, with the unreleased channel). It replaces
# Pages' own "deploy from a branch", which publishes every push to main
# whether or not anything works. The site is the repo as it stands, the
# same files that branch deploy served (.nojekyll keeps them raw).
#
# It also serves the unreleased channel: the newest build of main (the
# APK, which android.yml leaves as the artifact unreleased-android) under
# unreleased/, with build.json, by tools/unreleased.js. Not on the Releases
# page, so only the app's Channel → Unreleased finds it. Hidden, not
# private: the repo is public and the address can be guessed. Each deploy
# puts them in, and a finished build of main deploys again to bring its
# file in.
#
# Until the repo's Settings → Pages → Source is "GitHub Actions", Pages is
# still deploying from the branch on its own, so this says so and stops
# rather than failing.
name: Web app

on:
  push:
    branches: [main]
    # Markdown included: the app shows CHANGELOG.md in What's new.
    paths-ignore: ["test/**", ".claude/**", "worker/**"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Android app"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run'
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    # After a build of main: only a build that worked, and the test job is
    # skipped (main's head was tested by its own push, checked below).
    if: always() && (needs.test.result == 'success' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Check Pages deploys from Actions
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" != "workflow" ]; then
            echo "::notice::Pages deploys from '$kind', not from this workflow. Set Settings → Pages → Source to GitHub Actions to gate it on the tests."
          fi

      # After a build, main's head is deployed, never an older commit: the
      # built one, or a newer one whose own deploy already passed its tests.
      # Otherwise that deploy is still coming and will bring the file in.
      - name: Which commit
        id: at
        if: steps.source.outputs.kind == 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_run ]; then echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit 0; fi
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$HEAD" = "$BUILT" ] || [ -n "$(gh run list -R "$GITHUB_REPOSITORY" -w pages.yml -c "$HEAD" -s success -L 1 --json databaseId --jq '.[].databaseId')" ]; then
            echo "sha=$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "main is at ${HEAD:0:7}, whose own deploy hasn't passed yet; it brings the build in"
          fi

      - uses: actions/checkout@v4
        if: steps.at.outputs.sha
        with:
          ref: ${{ steps.at.outputs.sha }}

      - name: The unreleased channel
        if: steps.at.outputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/unreleased.js fetch unreleased

      - uses: actions/upload-pages-artifact@v3
        if: steps.at.outputs.sha
        with:
          path: .

      # deploy-pages often finds no "github-pages" artifact right after the
      # upload (Nov 2026: most deploys of main failed so, and the web copy
      # and unreleased/ stayed behind). Wait and try again, twice.
      - uses: actions/deploy-pages@v4
        if: steps.at.outputs.sha
        id: deploy1
        continue-on-error: true

      - name: Wait before trying again
        if: steps.at.outputs.sha && steps.deploy1.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v4
        if: steps.at.outputs.sha && steps.deploy1.outcome == 'failure'
        id: deploy2
        continue-on-error: true

      - name: Wait before the last try
        if: steps.at.outputs.sha && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - uses: actions/deploy-pages@v4
        if: steps.at.outputs.sha && steps.deploy2.outcome == 'failure'
        id: deploy3
