name: tmp kokoro sha
on:
  push:
    branches: [fix/kokoro-null]
jobs:
  sha:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in kokoro-int8-en-v0_19 kokoro-multi-lang-v1_0 kokoro-int8-multi-lang-v1_1; do
            curl -sSL -o "$f.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$f.tar.bz2"
            echo "SHA $f $(stat -c %s $f.tar.bz2) $(sha256sum $f.tar.bz2 | cut -d' ' -f1)"
          done
          tar -tjf kokoro-int8-multi-lang-v1_1.tar.bz2 | head -40
