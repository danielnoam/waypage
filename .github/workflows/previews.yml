# Preview builds follow labels on a pull request (Daniel's ask, 1 Nov
# 2026): `preview` for the APK and IPA, `preview-android` or `preview-ios`
# for one, sooner. Adding one builds the branch (android.yml and/or
# ios.yml run on it, and tools/preview-release.sh publishes the
# pre-release); taking it off, closing the pull request or deleting the
# branch removes the pre-release. A fork's pull request has a read-only token
# here, and never gets a preview anyway.
name: Previews

on:
  delete:
  pull_request:
    types: [closed, labeled, unlabeled]

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && startsWith(github.event.label.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          LABEL: ${{ github.event.label.name }}
        run: |
          case "$LABEL" in preview|preview-android) gh workflow run android.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY" ;; esac
          case "$LABEL" in preview|preview-ios) gh workflow run ios.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY" ;; esac

  remove:
    if: (github.event_name == 'pull_request' && (github.event.action == 'closed' || (github.event.action == 'unlabeled' && startsWith(github.event.label.name, 'preview')))) || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.ref }}
        run: |
          TAG="preview-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          if gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "removed $TAG"
          else
            echo "no $TAG to remove"
          fi
