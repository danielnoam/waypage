# Deploys the web copy's fetch proxy (worker/) to Cloudflare when it
# changes on main, or by hand. Needs the repo secrets CLOUDFLARE_API_TOKEN
# (the "Edit Cloudflare Workers" template, this account only) and
# CLOUDFLARE_ACCOUNT_ID; without them it says so and stops. worker/README.md.
name: Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the fetch proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node test/worker.test.js

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet, so nothing was deployed (worker/README.md)."
            exit 0
          fi
          npx --yes wrangler@4.151.2 deploy
