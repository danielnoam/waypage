# Builds the iOS app from the same files as the web copy and the Android app,
# and attaches it to the release the Android workflow publishes. From
# LifeLog's ios.yml. It carries two app extensions (1.6.0): Waypage in the
# share sheet, and the home screen widgets.
#
# There's no Apple developer account behind it yet, so it can't be signed for
# real: what it makes is an ad-hoc-signed Waypage.ipa, which AltStore or
# SideStore sign with your own Apple ID when they install it (and re-sign
# every 7 days). With an account, this is where signing and a TestFlight
# upload go. A private repo's macOS minutes count 10x against the free
# Actions allowance; a public repo's are free.
name: iOS app

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "test/**", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      # The job's token isn't left in .git/config for every later step
      # (npm packages, Gradle plugins) to find; only the release step gets
      # it, through GH_TOKEN.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bundle the web app
        run: node tools/build-www.js

      # `cap add` runs pod install before the Podfile can be raised to the
      # iOS 15.5 Google's ML Kit (the setup-code scanner) needs, so that
      # install may fail as long as the project was written; `cap sync`
      # below installs again on the raised Podfile.
      - name: Generate the iOS project
        run: |
          npx cap add ios --packagemanager CocoaPods || test -f ios/App/Podfile
          node tools/ios-project.js

      # The share extension and the widgets (1.6.0): two more targets, added
      # with CocoaPods' own xcodeproj library before pod install runs again
      # in cap sync.
      - name: Add the extensions
        run: |
          ruby -e 'require "xcodeproj"' 2>/dev/null || gem install --user-install --no-document xcodeproj
          ruby tools/ios-extensions.rb

      - name: Icon and splash
        run: >-
          npx --yes @capacitor/assets@3.0.5 generate --ios
          --iconBackgroundColor '#2F5D8A' --iconBackgroundColorDark '#2F5D8A'
          --splashBackgroundColor '#F7F4EE' --splashBackgroundColorDark '#F7F4EE'

      - name: Version
        id: v
        run: echo "version=$(node -p "require('./tools/build-www').appVersion()")" >> "$GITHUB_OUTPUT"

      - run: npx cap sync ios

      # The log's tail is where xcodebuild says what failed. `shell: bash`
      # is what runs with pipefail (the default is plain bash -e), so a
      # failed build fails the step rather than the packaging after it.
      - name: Build
        working-directory: ios/App
        shell: bash
        run: >-
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build 2>&1 | tail -80

      # An .ipa is a zip of Payload/<name>.app, signed ad hoc (no identity,
      # just a signature) so AltStore and SideStore can re-sign it. The
      # signature is what carries the entitlements: unsigned, the App Group
      # the extensions share with the app wouldn't exist. Inside out:
      # frameworks, then the extensions, then the app.
      - name: Package
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          [ ! -d Payload/App.app/Frameworks ] || find Payload/App.app/Frameworks -maxdepth 1 -name "*.framework" -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements native/share/ios/ShareExtension/WaypageShare.entitlements Payload/App.app/PlugIns/WaypageShareExtension.appex
          codesign --force --sign - --entitlements native/share/ios/Widgets/WaypageWidgets.entitlements Payload/App.app/PlugIns/WaypageWidgets.appex
          codesign --force --sign - --entitlements native/share/ios/App.entitlements Payload/App.app
          codesign -d --entitlements - Payload/App.app/PlugIns/WaypageWidgets.appex 2>&1 | grep -q application-groups
          zip -qry Waypage.ipa Payload
          ls -lh Waypage.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Waypage-${{ steps.v.outputs.version }}-ios-unsigned
          path: Waypage.ipa

      # The Android workflow creates the release; this waits for it rather than
      # racing it, since whichever created it first would leave the other's
      # "already released" check skipping its own upload. Android publishes
      # only with the signing secrets, so without them there is no release to
      # wait for, and waiting would burn 20 Mac minutes (billed 10x on a
      # private repo) before failing.
      - name: Attach to the release
        if: github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            if gh release view "app-v$V" >/dev/null 2>&1; then
              gh release upload "app-v$V" Waypage.ipa --clobber
              exit 0
            fi
            sleep 30
          done
          echo "No app-v$V release after 20 minutes (did the Android build publish one?)"; exit 1

      # A branch with an open pull request: the IPA joins the preview
      # pre-release the Android workflow made at this commit (1.48.0).
      - name: Attach to the preview
        if: github.ref != 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: bash tools/preview-release.sh attach Waypage.ipa
